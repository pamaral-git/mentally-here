name: Deploy HTML Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Build
        run: |
          mkdir -p _site
          touch _site/.nojekyll

          find . -type f -name "*.html" ! -path "./_site/*" ! -path "./.git/*" | while read -r file; do
            name=$(basename "$file" .html)
            mkdir -p "_site/$name"
            cp "$file" "_site/$name/index.html"
          done

          # auto-index since you have no index.html
          echo '<!DOCTYPE html><html><body><h1>Pages</h1><ul>' > _site/index.html
          for d in _site/*/; do
            p=$(basename "$d")
            echo "<li><a href=\"$p/\">/$p/</a></li>" >> _site/index.html
          done
          echo '</ul></body></html>' >> _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - uses: actions/deploy-pages@v4
        id: deployment
