name: Deploy HTML Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build _site with only your 2 files
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp fitness-hub.html _site/
          cp safety-plan.html _site/

          # create a homepage that lists both
          cat > _site/index.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mentally-here</title></head>
          <body style="font-family:system-ui;max-width:600px;margin:40px auto;line-height:1.6">
            <h1>mentally-here</h1>
            <ul>
              <li><a href="./fitness-hub.html">fitness-hub.html</a></li>
              <li><a href="./safety-plan.html">safety-plan.html</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
